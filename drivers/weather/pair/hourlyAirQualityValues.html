<link rel="stylesheet" type="text/css" href="../../../assets/css/autoComplete.css"/>
<link rel="stylesheet" type="text/css" href="../../../assets/css/setup.css"/>
<script src="../../../assets/js/weatherVariableSelector.js"></script>

<div class="hy-view __private__open_meteo-setup__view" data-id="weatherVariables" data-template-id="weatherVariables"
     id="87645378645645-67869978456456">
    <div class="__private__open_meteo-setup">
        <form id="setup-form"
              class="__private__open_meteo-setup__form homey-form weather-variable-form"
              action="/"
              method="post">
            <div class="__private__open_meteo-setup__center weather-variable-center">
                <h1 id="setup-title" class="homey-title homey-text-align-center">Weather variables</h1>
                <div class="weather-variable-controls">
                    <input id="variable-search" class="homey-form-input weather-variable-search" type="search">
                    <div class="weather-variable-toolbar">
                        <span id="selection-summary" class="weather-variable-summary" aria-live="polite"></span>
                        <div class="weather-variable-actions">
                            <button id="select-visible" class="weather-variable-action" type="button"></button>
                            <button id="clear-visible" class="weather-variable-action" type="button"></button>
                        </div>
                    </div>
                </div>
                <div class="homey-form-group weather-variable-list">
                    <div id="checkbox-form"></div>
                    <p id="variable-no-results" class="weather-variable-no-results" hidden></p>
                </div>
            </div>

            <div class="__private__open_meteo-setup__information">
                <a href="javascript:;"
                   data-i18n="pair.setup.open-meteo"
                   onclick="Homey.popup('https://open-meteo.com/')">
                    Weather data by Open-Meteo.com</a>
            </div>

            <div class="__private__open_meteo-setup__footer">
                <button tabindex="0" id="setup-next"
                        data-i18n="pair.setup.next"
                        class="homey-button-primary-shadow-full __private__open_meteo-setup__button"
                        type="submit">
                    Next
                </button>
            </div>
        </form>
    </div>
</div>
<script type="text/javascript">
    OpenMeteoWeatherVariables.init({repair: false}).catch(function (error) {
        Homey.error(error);
    });
</script>
