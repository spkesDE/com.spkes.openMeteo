<link rel="stylesheet" type="text/css" href="../../../assets/css/autoComplete.css"/>
<link rel="stylesheet" type="text/css" href="../../../assets/css/setup.css"/>

<div class="hy-view __private__open_meteo-setup__view"
     data-id="setup"
     data-template-id="setup"
     id="684836237846456.454564564561236">
    <div class="__private__open_meteo-setup">
        <form id="setup-form"
              class="__private__open_meteo-setup__form homey-form location-setup-form"
              action="/"
              method="post">
            <div class="__private__open_meteo-setup__center location-setup-center">
                <h1 id="setup-title"
                    data-i18n="pair.setup.title"
                    class="homey-title homey-text-align-center">
                    Please enter your location
                </h1>
                <p class="location-setup-hint homey-text-align-center"
                   data-i18n="pair.setup.location.hint">
                    Start typing and select a location from the search results.
                </p>

                <div class="homey-form-group">
                    <label class="homey-form-label"
                           data-i18n="pair.setup.location.label"
                           for="location">
                        Location
                    </label>
                    <input class="homey-form-input"
                           data-i18n="pair.setup.location.placeholder"
                           id="location"
                           name="location"
                           type="text"
                           placeholder="Hamburg"
                           autocomplete="off"
                           required>
                    <div class="selectedResult hidden" id="selectedResult">
                        <div class="selectedResultLabel" data-i18n="pair.setup.selectedLocation">
                            Selected Location
                        </div>
                        <div class="selectedResultItem" id="selectedResultItem"></div>
                    </div>
                </div>

                <div class="homey-form-group">
                    <label data-i18n="pair.setup.forecast.label"
                           class="homey-form-label"
                           for="select-forecast">
                        Get forecast
                    </label>
                    <select class="homey-form-select" name="select-forecast" id="select-forecast">
                        <option data-i18n="pair.setup.forecast.today" selected value="0">Current Day</option>
                        <option data-i18n="pair.setup.forecast.1day" value="1">Tomorrow</option>
                        <option data-i18n="pair.setup.forecast.2day" value="2">In 2 days</option>
                        <option data-i18n="pair.setup.forecast.3day" value="3">In 3 days</option>
                        <option data-i18n="pair.setup.forecast.4day" value="4">In 4 days</option>
                        <option data-i18n="pair.setup.forecast.5day" value="5">In 5 days</option>
                        <option data-i18n="pair.setup.forecast.6day" value="6">In 6 days</option>
                        <option data-i18n="pair.setup.forecast.7day" value="7">In 7 days</option>
                        <option data-i18n="pair.setup.forecast.8day" value="8">In 8 days</option>
                        <option data-i18n="pair.setup.forecast.9day" value="9">In 9 days</option>
                        <option data-i18n="pair.setup.forecast.10day" value="10">In 10 days</option>
                        <option data-i18n="pair.setup.forecast.11day" value="11">In 11 days</option>
                        <option data-i18n="pair.setup.forecast.12day" value="12">In 12 days</option>
                        <option data-i18n="pair.setup.forecast.13day" value="13">In 13 days</option>
                        <option data-i18n="pair.setup.forecast.14day" value="14">In 14 days</option>
                        <option data-i18n="pair.setup.forecast.15day" value="15">In 15 days</option>
                        <option data-i18n="pair.setup.forecast.16day" value="16">In 16 days</option>
                    </select>
                </div>

                <div class="homey-form-group">
                    <label data-i18n="pair.setup.timezone.label"
                           class="homey-form-label"
                           for="select-timezone">
                        Time zone
                    </label>
                    <select class="homey-form-select" name="select-timezone" id="select-timezone">
                        <option value="America/Anchorage">America/Anchorage</option>
                        <option value="America/Los_Angeles">America/Los_Angeles</option>
                        <option value="America/Denver">America/Denver</option>
                        <option value="America/Chicago">America/Chicago</option>
                        <option value="America/New_York">America/New_York</option>
                        <option value="America/Sao_Paulo">America/Sao_Paulo</option>
                        <option value="GMT">GMT+0</option>
                        <option data-i18n="pair.setup.timezone.auto" selected value="auto">
                            Automatically detect time zone
                        </option>
                        <option value="Europe/London">Europe/London</option>
                        <option value="Europe/Berlin">Europe/Berlin</option>
                        <option value="Europe/Moscow">Europe/Moscow</option>
                        <option value="Africa/Cairo">Africa/Cairo</option>
                        <option value="Asia/Bangkok">Asia/Bangkok</option>
                        <option value="Asia/Singapore">Asia/Singapore</option>
                        <option value="Asia/Tokyo">Asia/Tokyo</option>
                        <option value="Australia/Sydney">Australia/Sydney</option>
                        <option value="Pacific/Auckland">Pacific/Auckland</option>
                    </select>
                </div>
            </div>

            <div class="location-setup-bottom">
                <div class="__private__open_meteo-setup__information">
                    <a href="javascript:;"
                       data-i18n="pair.setup.open-meteo"
                       onclick="Homey.popup('https://open-meteo.com/')">
                        Weather data by Open-Meteo.com
                    </a>
                </div>
                <div class="__private__open_meteo-setup__footer">
                    <button tabindex="0"
                            id="setup-next"
                            data-i18n="pair.setup.next"
                            class="homey-button-primary-shadow-full __private__open_meteo-setup__button"
                            type="submit"
                            disabled>
                        Next
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script src="../../../assets/js/autoComplete.min.js"></script>
    <script src="../../../assets/js/locationSetup.js"></script>
    <script type="text/javascript">
        (function initializeLocationSetup(attempt) {
            const form = document.querySelector(
                '.hy-view.visible form.location-setup-form, form.location-setup-form'
            );
            const root = form && form.closest(".hy-view");

            if (window.OpenMeteoLocationSetup && window.autoComplete && root) {
                window.OpenMeteoLocationSetup.init({
                    repair: true,
                    root: root
                }).catch(function (error) {
                    Homey.error(error);
                });
                return;
            }

            if (attempt < 50) {
                window.setTimeout(function () {
                    initializeLocationSetup(attempt + 1);
                }, 20);
                return;
            }

            Homey.error(new Error("Failed to load the location setup scripts"));
        })(0);
    </script>
</div>
